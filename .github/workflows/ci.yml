name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build patched Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flatpak container
        run: |
          if [ ! -s /etc/machine-id ]; then
            dbus-uuidgen > /etc/machine-id
          fi

      - name: Build
        run: |
          dbus-run-session -- flatpak-builder \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            build-dir \
            com.discordapp.Discord.yaml

      - name: Verify Linux lock bridge
        run: |
          python3 scripts/verify-linux-lock-bridge.py \
            build-dir/files/discord/modules/discord_desktop_core/core.asar
