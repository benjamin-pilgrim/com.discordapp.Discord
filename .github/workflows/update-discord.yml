name: Update Discord Sources

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Rebase and check upstream artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase on Flathub master
        run: |
          git remote add upstream https://github.com/flathub/com.discordapp.Discord.git
          git fetch upstream master
          git rebase upstream/master

      - name: Update external Discord sources
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e GIT_AUTHOR_NAME="Flatpak External Data Checker" \
            -e GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            -e GIT_COMMITTER_NAME="Flatpak External Data Checker" \
            -e GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            -v "${PWD}:/repo" \
            -w /repo \
            ghcr.io/flathub/flatpak-external-data-checker:latest \
            --update --never-fork com.discordapp.Discord.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push updates
        run: |
          if ! git diff --quiet; then
            git add com.discordapp.Discord.yaml
            git commit -m "Update Discord sources"
          fi

          git push --force-with-lease origin HEAD:${GITHUB_REF_NAME}
